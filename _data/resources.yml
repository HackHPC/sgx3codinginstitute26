- category: Development & AI Tools
  color: teal
  resources:
    - name: TACC Analysis Portal (TAP)
      description: "Portal to access the Texas Advanced Computing Center and launch Jupyter Notebooks on Frontera."
      url: https://tap.tacc.utexas.edu/
      action: Visit
    - name: Google Colab
      description: "Cloud-based Jupyter Notebook environment for writing, testing, and sharing Python code."
      url: https://colab.research.google.com/
      action: Open
    - name: Obsidian
      description: "Note-taking application with built-in visual knowledge graphs and Markdown files — AI-readable."
      url: https://obsidian.md/
      action: Download
    - name: Globus
      description: Research data management service for transferring and sharing data across institutions.
      url: https://www.globus.org/
      action: Visit
    - name: LM Studio
      description: User-friendly tool for downloading and running local Large Language Models on personal computers.
      url: https://lmstudio.ai/
      action: Download
    - name: Ollama
      description: Terminal-based platform for setting up local AI inference servers and downloading open-source models.
      url: https://ollama.com/
      action: Download
    - name: Manus AI
      description: "AI agent that can write, test, and debug code within a sandboxed Docker environment."
      url: https://manus.im/
      action: Visit
    - name: Go Full Page (Chrome Extension)
      description: Browser extension for capturing and saving entire web pages as PDF documents.
      url: https://chromewebstore.google.com/detail/fdpohaocaechififmbbbbbknoalclacl
      action: Install

- category: APIs & Data Sources
  color: sky
  resources:
    - name: GitHub API
      description: Endpoint for fetching raw JSON data about GitHub users and their public repositories.
      code: "https://api.github.com/users/"
    - name: PokeAPI
      description: "Free, open REST API providing extensive Pokémon stats, abilities, and types — no API key required."
      code: "https://pokeapi.co/api/v2/pokemon/"
    - name: Open-Meteo API
      description: API providing free weather forecast data using latitude and longitude parameters.
      code: "https://api.open-meteo.com/v1/forecast"
    - name: Superhero API
      description: Endpoints for fetching JSON data containing statistics and biographies of superheroes.
      url: https://superheroapi.com/
      action: Docs
    - name: Superhero API JSON Data
      description: Direct JSON endpoint returning stats and data for all superheroes.
      code: "https://akabab.github.io/superhero-api/api/all.json"
    - name: Wikipedia API
      description: MediaWiki API for querying endpoints and scraping internal page links to build knowledge graphs.
      code: "https://en.wikipedia.org/w/api.php"
    - name: Serebii
      description: Comprehensive resource site for researching Pokémon statistics and information.
      url: https://serebii.net/
      action: Visit

